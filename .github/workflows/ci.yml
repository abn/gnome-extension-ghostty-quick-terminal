name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check and pack
    runs-on: ubuntu-latest
    # Fedora 44 ships GNOME Shell 50, the version this extension targets.
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install toolchain
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          git make gjs glib2 gnome-shell nodejs nodejs-npm pre-commit
      - uses: actions/checkout@v7
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check
        run: make check
      - name: Pack
        run: make build
      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/*.shell-extension.zip
          if-no-files-found: error
