name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, vX.Y.Z, created by Release Please
        required: true
        type: string

permissions:
  contents: write

jobs:
  pack:
    name: Pack and attach to the GitHub release
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install toolchain
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          git make gjs glib2 gnome-shell nodejs nodejs-npm pre-commit gh
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check
        run: make check
      - name: Tag must match version-name
        run: make release/check TAG="${{ inputs.tag }}"
      - name: Pack
        run: make build
      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/*.shell-extension.zip
          if-no-files-found: error
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/*.shell-extension.zip --clobber

  publish:
    name: Upload to extensions.gnome.org
    needs: pack
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    # Approval gate: configure this environment with required reviewers so a
    # human confirms every upload. Secrets EGO_USERNAME and EGO_PASSWORD
    # live on the environment, not on the repository.
    environment: extensions.gnome.org
    permissions:
      contents: read
    steps:
      - name: Install gnome-extensions
        run: dnf install -y --setopt=install_weak_deps=False gnome-shell
      - uses: actions/download-artifact@v8
        with:
          name: extension
          path: dist
      - name: Upload
        env:
          EGO_USERNAME: ${{ secrets.EGO_USERNAME }}
          EGO_PASSWORD: ${{ secrets.EGO_PASSWORD }}
        run: >-
          printf '%s' "$EGO_PASSWORD" |
          gnome-extensions upload --accept-tos
          --user "$EGO_USERNAME" --password-file -
          dist/*.shell-extension.zip
